name: Payment System CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test project
        run: mvn --batch-mode clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build executable JAR files
        run: mvn --batch-mode clean package -DskipTests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push wallet-service
        uses: docker/build-push-action@v7
        with:
          context: ./wallet-service
          file: ./wallet-service/Dockerfile
          push: true
          tags: |
            shyams17/payment-wallet-service:latest
            shyams17/payment-wallet-service:${{ github.sha }}

      - name: Build and push user-service
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: |
            shyams17/payment-user-service:latest
            shyams17/payment-user-service:${{ github.sha }}

      - name: Build and push transaction-service
        uses: docker/build-push-action@v7
        with:
          context: ./transaction-service
          file: ./transaction-service/Dockerfile
          push: true
          tags: |
            shyams17/payment-transaction-service:latest
            shyams17/payment-transaction-service:${{ github.sha }}

      - name: Build and push notification-service
        uses: docker/build-push-action@v7
        with:
          context: ./notification-service
          file: ./notification-service/Dockerfile
          push: true
          tags: |
            shyams17/payment-notification-service:latest
            shyams17/payment-notification-service:${{ github.sha }}

      - name: Build and push reward-service
        uses: docker/build-push-action@v7
        with:
          context: ./reward-service
          file: ./reward-service/Dockerfile
          push: true
          tags: |
            shyams17/payment-reward-service:latest
            shyams17/payment-reward-service:${{ github.sha }}

      - name: Build and push api-gateway
        uses: docker/build-push-action@v7
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            shyams17/payment-api-gateway:latest
            shyams17/payment-api-gateway:${{ github.sha }}