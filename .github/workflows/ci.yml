name: Payment System CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test project
        run: mvn --batch-mode clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  build-and-push-wallet-image:
    name: Build and Push Wallet Image
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build wallet-service JAR
        run: mvn --batch-mode -pl wallet-service -am clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push wallet-service image
        uses: docker/build-push-action@v6
        with:
          context: ./wallet-service
          file: ./wallet-service/Dockerfile
          push: true
          tags: |
            shyams17/payment-wallet-service:latest
            shyams17/payment-wallet-service:${{ github.sha }}