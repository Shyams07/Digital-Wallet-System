apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: payment-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: shyams17/payment-user-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: JWT_SECRET

            - name: WALLET_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: WALLET_SERVICE_URL

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: payment-system

spec:
  selector:
    app: user-service

  ports:
    - port: 8081
      targetPort: 8081

  type: ClusterIP