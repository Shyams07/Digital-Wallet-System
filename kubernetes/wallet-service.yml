apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: payment-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wallet-service

  template:
    metadata:
      labels:
        app: wallet-service

    spec:
      containers:
        - name: wallet-service
          image: shyams17/payment-wallet-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8088

---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: payment-system

spec:
  selector:
    app: wallet-service

  ports:
    - port: 8088
      targetPort: 8088

  type: ClusterIP