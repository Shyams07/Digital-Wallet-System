apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: payment-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: shyams17/payment-notification-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8084

          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: payment-system

spec:
  selector:
    app: notification-service

  ports:
    - port: 8084
      targetPort: 8084

  type: ClusterIP