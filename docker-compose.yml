services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - payment-network

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - payment-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - payment-network

  wallet-service:
    image: shyams17/payment-wallet-service:latest
    container_name: wallet-service
    ports:
      - "8088:8088"
    networks:
      - payment-network

  user-service:
    image: shyams17/payment-user-service:latest
    container_name: user-service
    depends_on:
      - wallet-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      WALLET_SERVICE_URL: http://wallet-service:8088
    networks:
      - payment-network

  transaction-service:
    image: shyams17/payment-transaction-service:latest
    container_name: transaction-service
    depends_on:
      - kafka
      - wallet-service
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WALLET_SERVICE_URL: http://wallet-service:8088
    networks:
      - payment-network

  notification-service:
    image: shyams17/payment-notification-service:latest
    container_name: notification-service
    depends_on:
      - kafka
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - payment-network

  reward-service:
    image: shyams17/payment-reward-service:latest
    container_name: reward-service
    depends_on:
      - kafka
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - payment-network

  api-gateway:
    image: shyams17/payment-api-gateway:latest
    container_name: api-gateway
    depends_on:
      - redis
      - user-service
      - transaction-service
      - notification-service
      - reward-service
    ports:
      - "8086:8086"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      REWARD_SERVICE_URL: http://reward-service:8085
    networks:
      - payment-network

networks:
  payment-network:
    driver: bridge