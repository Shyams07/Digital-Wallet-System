server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

wallet:
  service:
    url: ${WALLET_SERVICE_URL:http://localhost:8088/api/v1/wallets}

jwt:
  secret: ${JWT_SECRET}